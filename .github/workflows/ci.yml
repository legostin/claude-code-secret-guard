name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Install gitleaks
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - name: hooks/rules.ts is built from rules/*.toml
        run: python3 scripts/build_rules.py && git diff --exit-code hooks/rules.ts
      - name: Check the extra rules against gitleaks
        run: python3 scripts/check_rules.py
      - name: Validate the plugin and its marketplace
        run: claude plugin validate .
      - name: Run the tests
        run: claude plugin test .
