# secret-guard: a long random-looking token with no known shape, by its
# Shannon entropy (bits per character) and its mix of upper case, lower case
# and digits. Short passwords cannot be told from words this way (a string of
# n characters has at most log2(n) bits per character): rules/keywords.toml
# covers those. Hex strings (hashes, digests), UUIDs, SRI integrity values,
# paths, dotted names (property access in code) and alphabets are not tokens.
# Nor is a name made of plain parts (words, CamelCase words, CAPS, numbers,
# a short word and number: v2, rc1, 2fa)
# joined by - _ / +: a branch (bugfix/SHOP-4242-checkout-page), a ticket,
# a slug. A random token's parts mix case and digits (aB3x).

[[rules]]
id = "high-entropy-token"
description = "A long random-looking token with no known shape"
regex = '''(?:^|[\s"'`=:(,\[{])([A-Za-z0-9_+/~.-]{20,128}={0,2})(?:$|[\s"'`;,)\]}&])'''
secretGroup = 1
entropy = 4.0
[[rules.allowlists]]
regexTarget = "secret"
regexes = [
  '''^[^A-Z]*$''',
  '''^[^a-z]*$''',
  '''^[^0-9]*$''',
  '''\.''',
  '''^[0-9a-fA-F._-]+$''',
  '''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-''',
  '''(?i)^(sha1|sha256|sha384|sha512|md5)[-:]''',
  '''^/*[\w.-]*(/[\w.@+-]+){2,}/?$''',
  '''^//''',
  '''ABCDEFGHIJ|abcdefghij|0123456789''',
  '''^[\w-]+(\.[\w-]+){2,}$''',
  '''(?i)^(https?|file|git|ssh)[:/]''',
  '''^(?:[a-z]+(?:[A-Z][a-z]+)*|(?:[A-Z][a-z]+)+|[A-Z]+|[0-9]+|[a-z]{1,4}[0-9]{1,4}|[0-9]{1,4}[a-z]{1,4})(?:[-_/+](?:[a-z]+(?:[A-Z][a-z]+)*|(?:[A-Z][a-z]+)+|[A-Z]+|[0-9]+|[a-z]{1,4}[0-9]{1,4}|[0-9]{1,4}[a-z]{1,4}))+$''',
]
