# secret-guard: rules for secrets written after a keyword, in a URL, or in a
# known shape gitleaks' default set does not have. Read by scripts/build_rules.py
# into hooks/rules.ts; checked by scripts/check_rules.py against real gitleaks.

[[rules]]
id = "password-after-keyword"
description = "A password, secret or token written after a keyword, in English or Russian"
regex = '''(?i)(?:пароль|парол[яюеи]|password|passwd|passphrase|pwd|секрет|secret|токен|token|ключ доступа|access key)[\p{L}_-]*(?:(?:[ \t]+\p{L}{1,15}){1,3}(?:[ \t]*[:=][ \t]*|[ \t]+(?:—|–|-|is|это|равен)[ \t]+)|(?:[ \t]*[:=][ \t]*|[ \t]+(?:(?:—|–|-|is|это|равен)[ \t]+)?))["'`]?(?:[\p{L}_]{1,30}=)?([^\s"'`:=][^\s"'`]{5,})'''
secretGroup = 1
keywords = ["пароль", "пароля", "паролю", "пароле", "пароли", "password", "passwd", "passphrase", "pwd", "секрет", "secret", "токен", "token", "ключ доступа", "access key"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = [
  '''^[*_~]*[\p{L}_-]+[*_~]*[.,;:!?)]*$''',
  '''[<>]''',
  '''(?i)^(true|false|null|none|nil|undefined)\W*$''',
  '''^[0-9.,:/_-]+$''',
  '''^(?:~|\.{1,2})?/''',
  '''^\$[A-Za-z_{(]''',
  '''\{\{|\$\{|%\(''',
  '''^<[^>]*>$''',
  '''\w\(''',
  '''^\[|\]$''',
  '''^\*+$''',
  '''(?i)^(changeme|example|placeholder|redacted|xxx+|your[_-]?\w*)$''',
  '''(?i)^(?:password|passwd|passphrase|pwd|secret|token|пароль|парол\p{L}*|секрет\p{L}*|токен\p{L}*)s?[.,;:!?)]*$''',
  '''^[\p{L}_]+[=:](?:[0-9.]{1,8}|[\p{L}_-]{1,24})[.,;)]*$''',
  '''^[a-z_.-]+(?:/[a-z_.-]+)+$''',
  '''^[A-Za-z_]\w*(?:\.[A-Za-z_]\w*)+$''',
  '''^[(\[{]''',
  '''…''',
]
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''(?i)secret:[\w-]+#\d''']

[[rules]]
id = "password-assignment"
description = "A password in a config assignment (TOML, INI, .env, JSON, YAML): a value after a key that ends with password, passwd, pwd, passphrase, secret or _pass"
regex = '''(?im)(?:(?:^|[^\w])["']?[\w.-]*?(?:password|passwd|passphrase|pwd|secret|[_.-]pass|(?-i:Pass))["']?[ \t]*(?:=|:=)[ \t]*(?:"([^"\n]{4,200})"|'([^'\n]{4,200})\'|([^\s"'`#,;}\]]{4,200}))|(?:^[ \t]*(?:\d+(?:\t|→|:|-)[ \t]*|[^\s:]+:\d+[:-][ \t]*)?(?:-[ \t]+)?["']?[\w.-]*?(?:password|passwd|passphrase|pwd|secret|[_.-]pass|(?-i:Pass))["']?|"[\w.-]*?(?:password|passwd|passphrase|pwd|secret|[_.-]pass|(?-i:Pass))")[ \t]*:[ \t]*(?:"([^"\n]{4,200})"|'([^'\n]{4,200})\'|([^\s"'`#,;}\]]{4,200})(?:[ \t]+#.*)?[ \t]*$))'''
keywords = ["password", "passwd", "passphrase", "pwd", "secret", "pass"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = [
  '''^\$|\$\{|\{\{|%\(|\$\(''',
  '''^<[^>]*>$''',
  '''\w\(''',
  '''SECRET:|…''',
  '''^(?:~|\.{1,2})?/''',
  '''^[a-z_.-]+(?:/[a-z_.-]+)+$''',
  '''^[A-Za-z_]\w*(?:\.[A-Za-z_]\w*)+$''',
  '''^\*+$''',
  '''(?i)^(?:changeme|change_me|example|placeholder|redacted|xxx+|your[_-]?\w*|todo|none|null|nil|true|false|undefined|required|optional|string|str|number|int|integer|bool|boolean|bytes|text|varchar|any|object|secret|secrets|password|passwd|pwd|token|hidden|masked|empty|unset|env)$''',  '''^(?:\*\*|__|~~)[\p{L}\p{N} _-]+(?:\*\*|__|~~)[.,;!?)]*$''',
]
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''(?i)secret:[\w-]+#\d''']

[[rules]]
id = "credentials-pair"
description = "A login:password pair after a word about access or credentials, in English or Russian"
regex = '''(?i)(?:доступ|логин|креды|кред|учётк|учетк|учётн|учетн|аккаунт|вход|access|login|creds|credentials|account|auth)[\p{L}_-]*(?:[ \t]+[\p{L}\p{N}_.-]{1,20}){0,4}?[ \t]*[:=—–-]?[ \t]+["'`]?[\p{L}\p{N}_.@+-]{2,64}:([^\s"'`@]{6,})'''
secretGroup = 1
keywords = ["доступ", "логин", "креды", "кред", "учётк", "учетк", "учётн", "учетн", "аккаунт", "вход", "access", "login", "creds", "credentials", "account", "auth"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = [
  '''^[*_~]*[\p{L}_-]+[*_~]*[.,;:!?)]*$''',
  '''^[0-9.,:/_-]+$''',
  '''^[0-9]+[/?#]''',
  '''^//''',
  '''::''',
  '''^[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2})+$''',
  '''[<>]''',
  '''^\$|\$\{|\{\{''',
  '''(?i)(?:password|passwd|passphrase|pwd|secret|token|пароль|парол|секрет|токен)''',
]

[[rules]]
id = "url-credentials"
description = "A password in a URL's user info (scheme://user:password@host)"
regex = '''\b[a-zA-Z][a-zA-Z0-9+.-]*://[^\s:/@"'`]+:([^\s:/@"'`]{3,})@[^\s/@"'`]+'''
secretGroup = 1
keywords = ["://"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^\$''', '''^\{''', '''^<''', '''^\*+$''', '''(?i)^(password|pass|secret|changeme|xxx+)$''']

[[rules]]
id = "cli-password-argument"
description = "A password given on a command line: mysql -pPASS, sshpass -p PASS, curl -u user:PASS"
regex = '''(?i)(?:\b(?:mysql|mysqldump|mysqladmin|mariadb|mariadb-dump)\b[^\n|;&]*?\s-p([^\s"'`-][^\s"'`]{3,})|\bsshpass\b[^\n|;&]*?\s-p[ \t]*["']?([^\s"'`-][^\s"'`]{3,})|\b(?:curl|http|https)\b[^\n|;&]*?\s(?:-u|--user|--proxy-user)[ \t=]+["']?[^\s:"'`]+:([^\s"'`@]{4,}))'''
keywords = ["mysql", "mariadb", "sshpass", "curl", "http"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^\$''', '''\$\{''', '''^\{\{''', '''^<[^>]*>$''', '''^\*+$''', '''(?i)^(password|pass|passwd|changeme|xxx+)[.,;:)\\]*$''']

[[rules]]
id = "basic-auth"
description = "Credentials in an Authorization: Basic header"
regex = '''(?i)\bauthorization:[ \t]*basic[ \t]+([a-z0-9+/]{12,}={0,2})'''
secretGroup = 1
keywords = ["basic"]

[[rules]]
id = "bearer-token"
description = "A bearer token in an Authorization header"
regex = '''(?i)\bbearer[ \t]+([a-z0-9._~+/-]{16,}=*)'''
secretGroup = 1
entropy = 3.0
keywords = ["bearer"]

[[rules]]
id = "openai-project-key"
description = "An OpenAI project, service-account or admin key"
regex = '''\b(sk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{20,})'''
secretGroup = 1
keywords = ["sk-proj-", "sk-svcacct-", "sk-admin-"]
